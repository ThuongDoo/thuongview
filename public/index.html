<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThuongView</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem('tv-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark">🔥</span> ThuongView</a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="dashboard">Tổng quan</a>
      <a href="#/pages" data-route="pages">Pages</a>
      <a href="#/starred" data-route="starred">Đang theo dõi</a>
      <a href="#/settings" data-route="settings">Cài đặt</a>
    </nav>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip"></span>
      <button class="icon-btn" id="theme-btn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">◐</button>
    </div>
  </header>
  <main id="app" class="container"><div class="loading">Đang tải…</div></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
